services:

  nginx:
    image: nginx
    container_name: demo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


  app:
    build:
      context: ./app
    container_name: demo-app
    depends_on:
      - redis


  redis:
    image: redis
    container_name: demo-redis
    volumes:
      - redis-data:/data


volumes:

  redis-data:
